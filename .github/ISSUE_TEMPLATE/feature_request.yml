name: "💡 Feature Request"
description: "Suggest an idea or new capability for knowledge-diff"
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Have an idea to make knowledge-diff better?
        We would love to hear it! Please fill out the form below to propose your feature.
  - type: textarea
    id: problem
    attributes:
      label: "Is your feature request related to a problem?"
      description: "A clear and concise description of what the problem is. E.g., 'I'm always frustrated when...'"
      placeholder: "Currently, the action only supports..."
  - type: textarea
    id: solution
    attributes:
      label: "Describe the solution you'd like"
      description: "A clear and concise description of what you want to happen."
      placeholder: "Add support for a new LLM provider or configuration setting..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Describe alternatives you've considered"
      description: "A clear and concise description of any alternative solutions or workarounds you've considered."
  - type: textarea
    id: additional
    attributes:
      label: "Additional Context"
      description: "Any other context, screenshots, or examples of how the feature would look or work."
