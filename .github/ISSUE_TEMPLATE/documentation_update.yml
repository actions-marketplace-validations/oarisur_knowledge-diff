name: "📖 Outdated/Missing Documentation"
description: "Report issues with knowledge-diff's own documentation"
title: "[Docs]: "
labels: ["documentation", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Help us improve our docs!
        If you found an issue, typo, or gap in the documentation, please let us know so we can keep it up to date.
  - type: textarea
    id: doc-issue
    attributes:
      label: "Documentation Issue Description"
      description: "Which part of the documentation is incorrect, outdated, or hard to follow?"
      placeholder: "The README says option X does Y, but it actually does Z..."
    validations:
      required: true
  - type: input
    id: doc-link
    attributes:
      label: "Link to Outdated Page/Section"
      description: "URL or file path to the affected document."
      placeholder: "e.g., https://github.com/oarisur/knowledge-diff/blob/main/README.md#configuration"
  - type: textarea
    id: suggested-fix
    attributes:
      label: "Suggested Correction"
      description: "What should the documentation say instead?"
      placeholder: "Change 'X' to 'Y' under section..."
